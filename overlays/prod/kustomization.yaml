apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
images:
  - name: image-registry.openshift-image-registry.svc:5000/demo-cicd/demo-app
    newTag: latest
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: demo-app
      spec:
        template:
          spec:
            containers:
              - name: demo-app
                env:
                  - name: APP_ENV
                    value: prod
                  - name: GREETING_MESSAGE
                    value: Hello from PROD
