apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ninhomilton/demo-gitops.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
